# HOST nginx site for dragonkeeper.deele.dk
# Put this at /etc/nginx/sites-available/dragonkeeper.deele.dk and symlink it
# into /etc/nginx/sites-enabled/. certbot --nginx will later add the TLS/443
# block and the http->https redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name dragonkeeper.deele.dk;

    # Dragon photos are stored as base64 inside JSON bodies -> allow big payloads.
    client_max_body_size 25M;

    # Backend API -> backend container (host-networked, loopback only)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> frontend container (static SPA)
    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
