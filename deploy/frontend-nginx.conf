# nginx config INSIDE the frontend container (serves the SPA web build).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS bundle
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long-cache hashed static assets
    location /_expo/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback (expo web output = "single")
    location / {
        try_files $uri $uri/ /index.html;
    }
}
